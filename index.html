<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette</title>
    <link rel="stylesheet" href="Casino.css">
</head>
<body>
    <!-- Roulette-Rad -->
     <div id="Geld">0</div>
     <div id="Gewinn" role="status" aria-live="polite"></div>
    <div id="Roullete">
        <h1 id="Heading-Rouellte">Roulette</h1>
        <div id="wheel">
            <div class="wheel-rotation">
                <svg id="rouletteSvg" viewBox="0 0 500 500"></svg>
                <div class="numbers"></div>
            </div>
            <div id="ball" aria-hidden="true"></div>
        </div>
    </div>

    <!-- Wettbereich -->
    <div id="Wetten">
        <div id="roulette-table">
            <button id="Fehlermeldung"></button>
            <div id="Zahlen">
            <p id="0" class="Zahlen green">0</p>
            <p id="1" class="Zahlen rot">1</p>
            <p id="2" class="Zahlen schwarz">2</p>
            <p id="3" class="Zahlen rot">3</p>
            <p id="4" class="Zahlen schwarz">4</p>
            <p id="5" class="Zahlen rot">5</p>
            <p id="6" class="Zahlen schwarz">6</p>
            <p id="7" class="Zahlen rot">7</p>
            <p id="8" class="Zahlen schwarz">8</p>
            <p id="9" class="Zahlen rot">9</p>
            <p id="10" class="Zahlen schwarz">10</p>
            <p id="11" class="Zahlen schwarz">11</p>
            <p id="12" class="Zahlen rot">12</p>
            <p id="13" class="Zahlen schwarz">13</p>
            <p id="14" class="Zahlen rot">14</p>
            <p id="15" class="Zahlen schwarz">15</p>
            <p id="16" class="Zahlen rot">16</p>
            <p id="17" class="Zahlen schwarz">17</p>
            <p id="18" class="Zahlen rot">18</p>
            <p id="19" class="Zahlen rot">19</p>
            <p id="20" class="Zahlen schwarz">20</p>
            <p id="21" class="Zahlen rot">21</p>
            <p id="22" class="Zahlen schwarz">22</p>
            <p id="23" class="Zahlen rot">23</p>
            <p id="24" class="Zahlen schwarz">24</p>
            <p id="25" class="Zahlen rot">25</p>
            <p id="26" class="Zahlen schwarz">26</p>
            <p id="27" class="Zahlen rot">27</p>
            <p id="28" class="Zahlen schwarz">28</p>
            <p id="29" class="Zahlen schwarz">29</p>
            <p id="30" class="Zahlen rot">30</p>
            <p id="31" class="Zahlen schwarz">31</p>
            <p id="32" class="Zahlen rot">32</p>
            <p id="33" class="Zahlen schwarz">33</p>
            <p id="34" class="Zahlen rot">34</p>
            <p id="35" class="Zahlen schwarz">35</p>
            <p id="36" class="Zahlen rot">36</p>
            </div>

            <div id="column-bets" class="bet-row">
                <button id="third-column" type="button">2:1</button>
                <button id="second-column" type="button">2:1</button>
                <button id="first-column" type="button">2:1</button>
            </div>

            <div id="dozen-bets" class="bet-row">
                <button id="first-12" type="button">1. 12</button>
                <button id="second-12" type="button">2. 12</button>
                <button id="third-12" type="button">3. 12</button>
            </div>

            <div id="outside-bets" class="bet-row">
                <button id="low" type="button">1–18</button>
                <button id="even" type="button">Even</button>
                <button id="red" class="red-bet" type="button">Red</button>
                <button id="black" class="black-bet" type="button">Black</button>
                <button id="odd" type="button">Odd</button>
                <button id="high" type="button">19–36</button>
            </div>

        <div id="LosingScreen">
            <h1>Verloren</h1>
            <p id="gesamtGewinn">Gesamte Auszahlung: 0€</p>
            <button id="closeLosingScreen" type="button">Schließen</button>
            <button id="resetBtn" type="button">Nochmal</button>
        </div>
        </div>

      
     

        <!-- Spielsteuerung -->
        <div id="buttons">
            <button id="undoBtn" type="button">Undo</button>
            <button id="submitBtn" type="button">Spin</button>
        </div>

        <!-- Jetonauswahl -->
        <div id="Tokens">
            
            <button id="coin1" class="coins" type="button" draggable="true" aria-pressed="false">1</button>
            <button id="coin5" class="coins" type="button" draggable="true" aria-pressed="false">5</button>
            <button id="coin25" class="coins" type="button" draggable="true" aria-pressed="false">25</button>
            <button id="coin100" class="coins" type="button" draggable="true" aria-pressed="false">100</button>
            <button id="coin500" class="coins" type="button" draggable="true" aria-pressed="false">500</button>
            <button id="coin1000" class="coins" type="button" draggable="true" aria-pressed="false">1000</button>
            <button id="coin5000" class="coins" type="button" draggable="true" aria-pressed="false">5000</button>
        </div>
    </div>

    <script src="Casino.js"></script>
</body>
</html>
